services:
  nginx1:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - D:/Docker/belajar-docker/01-docker-bestpractices/html1:/usr/share/nginx/html

  nginx2:
    image: nginx
    ports:
      - "8081:80"
    volumes:
      - D:/Docker/belajar-docker/01-docker-bestpractices/html1:/usr/share/nginx/html
    networks:
      - network1

  mysql:
    image: mysql
    environment:
      MYSQL_DATABASE: "coba"
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_ROOT_HOST: "%"
    volumes:
      - D:/Docker/belajar-docker/01-docker-bestpractices/mysql_data:/var/lib/mysql
    networks:
      - network1
  
  phpmyadmin:
    image: phpmyadmin
    ports: 
      - "8082:80"
    environment:
      PMA_HOST: mysql
    networks:
      - network1

networks:
  network1:
    driver: bridge