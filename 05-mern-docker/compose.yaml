services:
  backend:
    build: ./backend
    container_name: mern-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: mern-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mongodb:
    image: mongo:8
    container_name: mern-mongodb
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: